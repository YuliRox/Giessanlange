services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount the repository into the container.
      - ..:/workspaces/Giessanlange:cached
      # Persist PlatformIO's downloaded platforms/toolchains/packages across rebuilds.
      - pio-cache:/home/vscode/.platformio
    working_dir: /workspaces/Giessanlange
    # Keep the container alive so the devcontainer can attach to it.
    command: sleep infinity
    # Bring the MQTT broker up alongside the dev container.
    depends_on:
      - mqtt
    # USB passthrough for flashing/monitoring the ESP32 is OPT-IN, because a static
    # device mapping is validated at container-create time and fails the whole boot
    # when the device is absent. To enable it, attach the board into WSL2 first (see
    # .devcontainer/README.md), then start the container with the USB override:
    #   docker compose -f docker-compose.yml -f docker-compose.usb.yml up
    # or add docker-compose.usb.yml to dockerComposeFile in devcontainer.json.

  # Eclipse Mosquitto MQTT broker for testing. Reachable from the dev container at
  # host "mqtt" port 1883 (e.g. mqtt://mqtt:1883), and from the host at localhost:1883.
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      # Override via a .env file or shell env; defaults are for local testing only.
      MQTT_USERNAME: ${MQTT_USERNAME:-tester}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-testpass}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSockets
    # Seed the password file from the credentials above on each start, then run the
    # broker. ($$ escapes compose interpolation so the vars resolve inside the shell.)
    command: >
      sh -c "mosquitto_passwd -b -c /mosquitto/data/passwd \"$$MQTT_USERNAME\" \"$$MQTT_PASSWORD\" &&
             exec mosquitto -c /mosquitto/config/mosquitto.conf"

volumes:
  pio-cache:
  mqtt-data:
