# Mosquitto config for local testing. Mosquitto 2.x binds to localhost by default;
# the explicit listeners below expose it to the dev container and host. Anonymous
# access is disabled — clients must authenticate with the credentials seeded into
# the password file at startup (see the mqtt service command in docker-compose.yml).

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/
