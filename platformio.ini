; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c6-devkitc-1
extra_configs = secrets.ini

; Defaults applied when secrets.ini is missing or omits a value. Copy
; secrets.ini.example to secrets.ini and fill in real values to override.
[secrets]
wifi_ssid =
wifi_pass =
mqtt_user =
mqtt_pass =
mqtt_broker =

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    pololu/VL53L0X @ ^1.3.1
    I2CSoilMoistureSensor
build_flags =
    -D 'WIFI_SSID="${secrets.wifi_ssid}"'
    -D 'WIFI_PASS="${secrets.wifi_pass}"'
    -D 'MQTT_USER="${secrets.mqtt_user}"'
    -D 'MQTT_PASS="${secrets.mqtt_pass}"'
    -D 'MQTT_BROKER="${secrets.mqtt_broker}"'

[env:native]
platform = native
test_framework = unity
; main.cpp pulls in <Arduino.h>, which the host toolchain can't provide.
; This env only exists to unit-test the lib/ components, so keep src/ out of it.
build_src_filter = -<*>
test_build_src = no
